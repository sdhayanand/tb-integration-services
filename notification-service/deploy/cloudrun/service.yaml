# Knative Serving manifest for Cloud Run. Ingress is restricted to internal + Pub/Sub push with OIDC:
# the push subscription `shipments-notification` is created (Terraform, tb-platform-infra) with
# oidc_token.service_account_email = pubsub-push@${PROJECT_ID}.iam.gserviceaccount.com and this
# service's URL as audience (PUSH_AUDIENCE). Only that SA has roles/run.invoker.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/part-of: tb-otd
  annotations:
    run.googleapis.com/ingress: all   # Pub/Sub push arrives from Google's network; IAM (run.invoker) gates it
    run.googleapis.com/description: "Pub/Sub push consumer of shipments-v1 -> customer notifications"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: notification-service@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: us-central1-docker.pkg.dev/${PROJECT_ID}/tb-otd/notification-service:${IMAGE_TAG}
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PUSH_AUDIENCE
              value: https://notification-service-${PROJECT_NUMBER}.us-central1.run.app
            - name: PUSH_SERVICE_ACCOUNT
              value: pubsub-push@${PROJECT_ID}.iam.gserviceaccount.com
            - name: NOTIFY_MODE
              value: log
            - name: LOG_JSON
              value: "true"
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
