name: ci
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
permissions: { contents: read, packages: write, id-token: write }

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sdhayanand

jobs:
  build:
    # unit tests (surefire) + Testcontainers integration tests (failsafe, Docker available on ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: '**/target/surefire-reports/**,**/target/failsafe-reports/**' }

  notification-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: notification-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: notification-service/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: docker build (smoke)
        run: docker build -t tb-notification-service:ci .

  images:     # push Java images to GHCR on main (Jib, no Docker daemon needed)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [order-intake-api, inventory-service, shipment-webhook]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # -am also installs the parent pom, which the module build needs to resolve the installed common artifact
      - run: mvn -B -ntp -DskipTests -pl common -am install
      - run: >
          mvn -B -ntp -DskipTests -pl ${{ matrix.module }} compile jib:build
          -Djib.to.image=${{ env.IMAGE_PREFIX }}/tb-${{ matrix.module }}:${{ github.sha }}
          -Djib.to.tags=latest

  notification-image:   # push the Python image to GHCR on main
    needs: notification-service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: >
          docker build notification-service
          -t ${{ env.IMAGE_PREFIX }}/tb-notification-service:${{ github.sha }}
          -t ${{ env.IMAGE_PREFIX }}/tb-notification-service:latest
      - run: docker push --all-tags ${{ env.IMAGE_PREFIX }}/tb-notification-service
